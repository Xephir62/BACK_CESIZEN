# sonar-project.properties — à placer à la racine du dépôt
#
# Remplacer projectKey et organization par les valeurs affichées sur
# SonarQube Cloud après l'import du dépôt (Administration > Analysis Method).

sonar.projectKey=Xephir62_BACK_CESIZEN
sonar.organization=xephir62-1
sonar.projectName=API CESIZen

# --- Périmètre analysé -------------------------------------------------------
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Fichiers exclus : dépendances, cache, code généré.
sonar.exclusions=\
  vendor/**,\
  var/**,\
  public/bundles/**,\
  public/assets/**,\
  config/reference.php

# Les migrations Doctrine sont générées : les analyser produit du bruit etttttt attention a bug
# sans valeur, mais on les garde visibles en lecture seule.
sonar.coverage.exclusions=\
  migrations/**,\
  src/Kernel.php,\
  tests/**

# --- Rapports produits par la CI ---------------------------------------------
sonar.php.coverage.reportPaths=var/coverage/clover.xml
sonar.php.tests.reportPath=var/coverage/junit.xml

# --- Attente du résultat de la porte qualité ---------------------------------
# Fait échouer le job si la quality gate n'est pas franchie, ce qui permet
# de la déclarer comme contrôle requis sur main et develop.
sonar.qualitygate.wait=true
